name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Flutter release the app is developed on (app/.metadata, pubspec.lock).
  FLUTTER_VERSION: '3.44.6'
  CARGO_TERM_COLOR: always

jobs:
  # Engine tests, app analyze/tests, release build and packaging on native
  # runners: Linux x64 and arm64.
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    env:
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      # libpipewire-0.3-dev, libclang-dev, clang: crossshell-platform-linux
      #   (bindgen generates the PipeWire bindings).
      # libgtk-3-dev, cmake, ninja-build, liblzma-dev, libstdc++-12-dev: the
      #   Flutter Linux build.
      # file, xvfb, dbus-x11, python3-pil, python3-tk, libgl1-mesa-dri,
      #   libegl1: scripts/smoke-linux.sh.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libclang-dev \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libpipewire-0.3-dev libxkbcommon-dev \
            file xvfb dbus-x11 python3-pil python3-tk \
            libgl1-mesa-dri libegl1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: ${{ matrix.arch }}

      # There are no Flutter SDK archives for Linux arm64, so clone the
      # release tag. The same method is used on x64.
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          uname -m
          flutter config --no-analytics --enable-linux-desktop
          flutter precache --linux
          flutter --version
          dart --version

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Flutter tests
        working-directory: app
        run: flutter test

      - name: Engine tests
        working-directory: engine
        run: cargo test --release --locked --workspace

      # Builds the engine and the app natively and packages
      # dist/crossshell-<version>-linux-<x64|arm64>.tar.gz.
      - name: Build and package
        run: scripts/build-linux.sh

      - name: Check the tarball
        run: |
          VERSION="$(grep -m1 '^version' engine/Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          NAME="crossshell-${VERSION}-linux-${{ matrix.arch }}"
          ls -l dist
          [ "$(ls dist | wc -l)" -eq 1 ]
          [ -f "dist/$NAME.tar.gz" ]
          tar -xzf "dist/$NAME.tar.gz" -C "$RUNNER_TEMP"
          BUNDLE="$RUNNER_TEMP/$NAME"
          for f in cross_shell crossshell-host crossshell-view lib/libapp.so lib/libflutter_linux_gtk.so data/icudtl.dat; do
            [ -f "$BUNDLE/$f" ] || { echo "::error::missing $f in the tarball"; exit 1; }
          done
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          # Every ELF file (app, engine binaries, plugin libraries, AOT code).
          checked=0
          bad=0
          while IFS= read -r -d '' f; do
            desc="$(file -b "$f")"
            case "$desc" in ELF*) ;; *) continue ;; esac
            echo "${f#"$BUNDLE"/}: $desc"
            checked=$((checked + 1))
            case "$desc" in
              *"$ELF_MACHINE"*) ;;
              *) echo "::error file=$f::not $ELF_MACHINE"; bad=1 ;;
            esac
          done < <(find "$BUNDLE" -type f -print0)
          echo "checked $checked ELF files"
          [ "$checked" -ge 5 ] && [ "$bad" -eq 0 ]

      - name: Smoke-run the tarball
        timeout-minutes: 10
        run: scripts/smoke-linux.sh "$BUNDLE"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # Same on Windows: the x64 and arm64 runners build natively with MSVC.
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            rust_host: x86_64-pc-windows-msvc
            pe_machine: '0x8664'
            elf_machine: '0x3E'
          - arch: arm64
            runner: windows-11-arm
            rust_host: aarch64-pc-windows-msvc
            pe_machine: '0xAA64'
            elf_machine: '0xB7'
    defaults:
      run:
        shell: pwsh
    env:
      ARCH: ${{ matrix.arch }}
      # COFF machine of every .exe/.dll, and ELF e_machine of the AOT snapshot
      # (data\app.so is an ELF file on Windows too).
      PE_MACHINE: ${{ matrix.pe_machine }}
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain the image carries
        run: |
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -property displayName
          foreach ($c in 'VC.Tools.x86.x64', 'VC.Tools.ARM64', 'VC.ATL', 'VC.ATL.ARM64') {
            $path = & $vswhere -latest -products * -requires "Microsoft.VisualStudio.Component.$c" -property installationPath
            '{0,-20} {1}' -f $c, ($(if ($path) { 'installed' } else { 'missing' }))
          }
          Get-Command rustup, cargo, rustc -ErrorAction SilentlyContinue | Format-Table Name, Source

      # The runner images may not carry Rust (or a current one): use rustup,
      # installing it first when it is missing, and the stable toolchain for
      # the host triple.
      - name: Install Rust (stable, ${{ matrix.rust_host }})
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue) -and -not (Test-Path "$cargoBin\rustup.exe")) {
            $triple = '${{ matrix.rust_host }}'
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$triple/rustup-init.exe" -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
            & "$env:RUNNER_TEMP\rustup-init.exe" -y --default-toolchain none --profile minimal --default-host $triple
          }
          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin
          $env:PATH = "$cargoBin;$env:PATH"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup show
          $rustHost = (rustc -vV | Select-String '^host:').Line
          $rustHost
          if ($rustHost -ne 'host: ${{ matrix.rust_host }}') { throw "rustc host is not ${{ matrix.rust_host }}" }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: ${{ matrix.arch }}

      # On an ARM64 host (PROCESSOR_ARCHITECTURE=ARM64) the bootstrap fetches
      # the arm64 Dart SDK and `flutter build windows` targets windows-arm64.
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --depth 1 --branch $env:FLUTTER_VERSION `
            https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\flutter\bin"

      - name: Configure Flutter
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          flutter config --no-analytics --enable-windows-desktop
          flutter precache --windows
          flutter --version
          dart --version

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Flutter tests
        working-directory: app
        run: flutter test

      # crossshell-platform-linux is Linux-only, so it is not part of this run.
      - name: Engine tests
        working-directory: engine
        run: cargo test --release --locked -p crossshell-proto -p crossshell-platform -p crossshell-platform-windows -p crossshell-host -p crossshell-view

      - name: Build the engine
        working-directory: engine
        run: cargo build --release --locked -p crossshell-host -p crossshell-view

      - name: Build the app
        working-directory: app
        run: flutter build windows --release

      # Adds the engine executables to the app folder and writes
      # dist\crossshell-<version>-windows-<x64|arm64>.zip.
      - name: Package
        run: ./scripts/package-windows.ps1

      - name: Check the zip
        run: |
          function Get-PeMachine([string]$Path) {
            $fs = [IO.File]::OpenRead($Path)
            try {
              $br = New-Object IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $fs.Position = $br.ReadInt32()
              if ($br.ReadUInt32() -ne 0x4550) { throw "$Path is not a PE file" }
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $version = (Select-String -Path engine\Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $name = "crossshell-$version-windows-$env:ARCH"
          Get-ChildItem dist | Format-Table Name, Length
          if ((Get-ChildItem dist).Count -ne 1 -or -not (Test-Path "dist\$name.zip")) { throw "expected exactly dist\$name.zip" }

          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist\$name.zip"))
          try {
            $names = $zip.Entries.FullName
            "zip: $($names.Count) entries"
            if ($names | Where-Object { $_ -like '*\*' }) { throw 'the zip has backslash separators' }
            foreach ($f in 'cross_shell.exe', 'crossshell-host.exe', 'crossshell-view.exe', 'flutter_windows.dll', 'data/app.so', 'data/icudtl.dat') {
              if ($names -notcontains $f) { throw "$f is not at the root of the zip" }
            }
          } finally { $zip.Dispose() }

          $dir = Join-Path $env:RUNNER_TEMP $name
          Expand-Archive -Path "dist\$name.zip" -DestinationPath $dir
          "BUNDLE=$dir" | Add-Content -Path $env:GITHUB_ENV

          $expected = [Convert]::ToUInt16($env:PE_MACHINE, 16)
          $files = Get-ChildItem -Path $dir -Recurse -File -Include *.exe, *.dll
          $bad = 0
          foreach ($f in $files) {
            $m = Get-PeMachine $f.FullName
            '{0,-50} 0x{1:X4}' -f $f.FullName.Substring($dir.Length + 1), $m
            if ($m -ne $expected) { Write-Host "::error file=$($f.FullName)::machine 0x$('{0:X4}' -f $m), expected $env:PE_MACHINE"; $bad++ }
          }
          $bytes = [IO.File]::ReadAllBytes("$dir\data\app.so")
          $elf = [BitConverter]::ToUInt16($bytes, 0x12)
          'data\app.so ELF e_machine 0x{0:X2}' -f $elf
          if ($elf -ne [Convert]::ToUInt16($env:ELF_MACHINE, 16)) { Write-Host "::error::app.so is not $env:ELF_MACHINE"; $bad++ }
          "checked $($files.Count) PE files and app.so"
          if ($bad -or $files.Count -lt 8) { exit 1 }

      - name: Smoke-run the zip
        timeout-minutes: 10
        run: ./scripts/smoke-windows.ps1 -Dir $env:BUNDLE -NativeCapture -App

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  # The Snap Store package (strict confinement). Built on each architecture
  # as a workflow artifact only: uploading to the store is done by hand.
  snap:
    name: Snap ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            triplet: x86_64-linux-gnu
            elf_machine: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            triplet: aarch64-linux-gnu
            elf_machine: ARM aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: snapcore/action-build@v1
        id: build

      - name: Assert the snap is ${{ matrix.arch }}
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          ELF_MACHINE: ${{ matrix.elf_machine }}
          TRIPLET: ${{ matrix.triplet }}
        run: |
          ls -l "$SNAP_FILE"
          case "$SNAP_FILE" in
            *_${{ matrix.arch }}.snap) ;;
            *) echo "::error::unexpected snap file name $SNAP_FILE"; exit 1 ;;
          esac
          command -v unsquashfs > /dev/null || sudo apt-get install -y squashfs-tools
          S="$RUNNER_TEMP/snap"
          unsquashfs -q -d "$S" "$SNAP_FILE"
          sed -n '/^architectures:/,/^[a-z]/p' "$S/meta/snap.yaml"
          grep -qx -- '- ${{ matrix.arch }}' "$S/meta/snap.yaml"
          # Snapcraft must have expanded the triplet in the app environment.
          grep -n 'SPA_PLUGIN_DIR\|PIPEWIRE_MODULE_DIR' "$S/meta/snap.yaml"
          grep -qF "\$SNAP/usr/lib/$TRIPLET/spa-0.2" "$S/meta/snap.yaml"
          grep -qF "\$SNAP/usr/lib/$TRIPLET/pipewire-0.3" "$S/meta/snap.yaml"
          # What the snap carries for PipeWire on this architecture.
          find "$S/usr/lib/$TRIPLET" -maxdepth 1 \( -name '*pipewire*' -o -name 'spa-0.2' \)
          [ -d "$S/usr/lib/$TRIPLET/spa-0.2" ]
          for f in cross_shell crossshell-host crossshell-view usr/bin/ssh "usr/lib/$TRIPLET/libpipewire-0.3.so.0"; do
            [ -e "$S/$f" ] || { echo "::error::missing $f in the snap"; exit 1; }
            file -L "$S/$f" | tee /dev/stderr | grep -q "$ELF_MACHINE"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  # The .rpm (Fedora, RHEL, openSUSE), the Arch package and the AppImage.
  # CrossShell has no .deb, so packaging/linux-distros/tree.sh lays out the
  # installed tree from each architecture's tarball above and every format is
  # built from that one tree (the same binaries as the tarball). verify.sh then
  # installs each on the real distribution and runs scripts/smoke-linux.sh
  # there: the .rpm on Fedora and openSUSE Tumbleweed, the Arch package on
  # Arch (x64 only: Arch has no official arm64 image, so the arm64 package
  # gets a static check), the AppImage on Fedora.
  distros:
    name: Other distros ${{ matrix.arch }}
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
    env:
      NFPM_VERSION: '2.48.0'
      APPIMAGETOOL_VERSION: '1.9.1'
      ARCH: ${{ matrix.arch }}
      DEB_ARCH: ${{ matrix.deb_arch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: tarball

      # nfpm is checked against its release's checksums file.
      - name: Install nfpm and appimagetool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in
            x86_64) nfpm_arch=x86_64; ai_arch=x86_64 ;;
            aarch64) nfpm_arch=arm64; ai_arch=aarch64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          gh release download "$APPIMAGETOOL_VERSION" -R AppImage/appimagetool \
            -p "appimagetool-$ai_arch.AppImage" -O appimagetool
          chmod +x appimagetool
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The Flatpak job builds from the same cleaned tree (tar keeps modes and
      # symlinks).
      - name: Build the .rpm, Arch package and AppImage
        run: |
          VERSION="$(grep -m1 '^version' engine/Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          packaging/linux-distros/tree.sh "tarball/crossshell-$VERSION-linux-$ARCH.tar.gz" "$RUNNER_TEMP/root"
          VERSION="$VERSION" TREE_TARBALL="$RUNNER_TEMP/tree.tar.xz" \
            packaging/linux-distros/pack.sh "$RUNNER_TEMP/root" "$DEB_ARCH" dist

      - name: Install and run them on Fedora, openSUSE and Arch
        timeout-minutes: 30
        run: packaging/linux-distros/verify.sh dist "$DEB_ARCH"

      - uses: actions/upload-artifact@v7
        with:
          name: distros-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}/tree.tar.xz
          if-no-files-found: error
          retention-days: 3

  # The AUR recipe for crossshell-bin (it repackages the release tarballs):
  # PKGBUILD and .SRCINFO rendered with this build's checksums, built with
  # makepkg, installed and checked with ldd on archlinux:latest. Pushing it to
  # the AUR is done by hand.
  aur:
    name: AUR PKGBUILD
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: tarballs
          merge-multiple: true

      - name: Render and check the PKGBUILD
        run: |
          VERSION="$(grep -m1 '^version' engine/Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          VERSION="$VERSION" packaging/arch/aur.sh \
            "tarballs/crossshell-$VERSION-linux-x64.tar.gz" "tarballs/crossshell-$VERSION-linux-arm64.tar.gz" dist

      - uses: actions/upload-artifact@v7
        with:
          name: aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

  # The Flatpak bundle, from the same tree as the .rpm (the GNOME 51 runtime,
  # plus OpenSSH's client tools built from source, since the runtime has
  # none). It is installed in the builder image, checked with ldd inside the
  # sandbox, and scripts/smoke-flatpak.sh runs the bundled ssh tools, the
  # engine and the app there. What the sandbox allows is in
  # packaging/flatpak/README.md.
  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [distros]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            fp_arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            fp_arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      APP_ID: com.dhivalabs.cross_shell
      FP_ARCH: ${{ matrix.fp_arch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}/tree

      - name: Unpack the installed tree
        id: v
        run: |
          mkdir -p packaging/flatpak/tree
          tar -xJf "$RUNNER_TEMP/tree/tree.tar.xz" -C packaging/flatpak/tree
          VERSION="$(grep -m1 '^version' engine/Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          echo "bundle=crossshell-$VERSION-$FP_ARCH.flatpak" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.dhivalabs.cross_shell.yml
          bundle: ${{ steps.v.outputs.bundle }}
          arch: ${{ matrix.fp_arch }}
          cache: false
          artifact-name: flatpak-${{ matrix.arch }}

      - name: Install the bundle and run it
        timeout-minutes: 15
        env:
          BUNDLE: ${{ steps.v.outputs.bundle }}
        run: |
          for tool in flatpak xvfb-run dbus-run-session python3; do
            printf '%-18s %s\n' "$tool" "$(command -v "$tool" || echo missing)"
          done
          flatpak install --system -y --noninteractive "./$BUNDLE"
          flatpak info "$APP_ID"
          # Every ELF file in the app finds its libraries inside the runtime.
          flatpak run --command=bash "$APP_ID" -c '
            missing=0
            for f in /app/bin/ssh /app/bin/ssh-keygen /app/bin/ssh-keyscan \
                /app/lib/crossshell/cross_shell /app/lib/crossshell/crossshell-host \
                /app/lib/crossshell/crossshell-view /app/lib/crossshell/lib/*.so; do
              out="$(LD_LIBRARY_PATH=/app/lib/crossshell/lib ldd "$f")" || { echo "ldd failed on $f"; missing=1; continue; }
              if printf "%s\n" "$out" | grep "not found"; then echo "  in $f"; missing=1; fi
              echo "$f: ok"
            done
            [ "$missing" = 0 ]'
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- scripts/smoke-flatpak.sh "$APP_ID"

  # Releases are made by hand. When a release is published, this job attaches
  # the files of both architectures that are not on it yet (tarballs, zips,
  # .rpm, Arch packages, AppImages, Flatpak bundles and the AUR recipe), plus
  # SHA256SUMS when it has none. It never replaces an asset: files uploaded by
  # hand win, so a release can also be published with notes only and this job
  # completes it. On every other event it only selects and checks the files,
  # so that part is tested on PRs.
  release:
    name: Release assets
    needs: [linux, windows, distros, aur, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: engine/Cargo.toml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: distros-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: aur
          path: assets

      - uses: actions/download-artifact@v8
        with:
          pattern: flatpak-*
          path: assets
          merge-multiple: true

      - name: Select the release assets
        id: select
        run: |
          VERSION="$(grep -m1 '^version' engine/Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          FILES="crossshell-${VERSION}-linux-x64.tar.gz crossshell-${VERSION}-linux-arm64.tar.gz crossshell-${VERSION}-windows-x64.zip crossshell-${VERSION}-windows-arm64.zip"
          for a in x86_64 aarch64; do
            FILES="$FILES crossshell-${VERSION}-1.${a}.rpm crossshell-${VERSION}-1-${a}.pkg.tar.zst"
            FILES="$FILES CrossShell-${VERSION}-${a}.AppImage crossshell-${VERSION}-${a}.flatpak"
          done
          FILES="$FILES crossshell-bin-${VERSION}-aur.tar.gz"
          ls -l assets
          [ "$(ls assets | wc -l)" -eq 13 ]
          (cd assets && ls -l $FILES && sha256sum $FILES)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Upload to release ${{ github.event.release.tag_name }}
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.select.outputs.version }}
          FILES: ${{ steps.select.outputs.files }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match the version $VERSION in engine/Cargo.toml"
            exit 1
          fi
          cd assets
          # No grep -q here: with pipefail it can end the pipeline early.
          has() { gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -xF -- "$1" > /dev/null; }

          # Upload what the release does not have yet. No --clobber: an asset
          # that is there, or appears while this runs, is kept as it is.
          for f in $FILES; do
            if has "$f"; then
              echo "$f is already on the release; keeping it"
            elif gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"; then
              echo "uploaded $f"
            elif has "$f"; then
              echo "$f appeared on the release meanwhile; keeping it"
            else
              echo "::error::could not upload $f"
              exit 1
            fi
          done

          # SHA256SUMS only when the release has none. It covers the files as
          # they are on the release (downloaded when this job did not upload
          # them).
          if has SHA256SUMS; then
            echo "SHA256SUMS is already on the release; keeping it"
          else
            mkdir on-release
            : > SHA256SUMS
            for f in $FILES; do
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$f" --dir on-release
              (cd on-release && sha256sum "$f") >> SHA256SUMS
            done
            cat SHA256SUMS
            gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              || has SHA256SUMS
          fi

  # The standalone crossshell-host agents that other apps (SecureShell Go)
  # upload to a remote machine (scripts/build-agents.sh). The x64 runner
  # cross-builds every flavour but the aarch64 full one, which links arm64
  # PipeWire and is built on the arm runner.
  agents:
    name: Agents ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-gnu,aarch64-pc-windows-gnullvm
            flavours: linux-x86_64 linux-x86_64-x11 linux-aarch64-x11 windows-x64 windows-arm64
          - arch: arm64
            runner: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
            flavours: linux-aarch64
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libclang-dev libpipewire-0.3-dev file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: agents-${{ matrix.arch }}

      # cargo-zigbuild finds zig through `python3 -m ziglang` of this venv.
      - name: Install zig and cargo-zigbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang cargo-zigbuild
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      - name: Build the agents
        run: scripts/build-agents.sh --strict ${{ matrix.flavours }}

      - uses: actions/upload-artifact@v7
        with:
          name: agents-${{ matrix.arch }}
          path: dist/agents/crossshell-host-*
          if-no-files-found: error

  # On a published release, attaches the agents it does not have yet, and
  # crossshell-host-SHA256SUMS over the agents as they are on the release
  # when it has none. Never replaces an asset, like the release job. On
  # other events it only checks that all six were built.
  agents-release:
    name: Agent release assets
    needs: [agents]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      FILES: >-
        crossshell-host-linux-x86_64 crossshell-host-linux-x86_64-x11
        crossshell-host-linux-aarch64 crossshell-host-linux-aarch64-x11
        crossshell-host-windows-x64.exe crossshell-host-windows-arm64.exe
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: agents-*
          path: agents
          merge-multiple: true

      - name: Check the agents
        working-directory: agents
        run: |
          ls -l
          [ "$(ls | wc -l)" -eq 6 ]
          sha256sum $FILES

      - name: Upload to release ${{ github.event.release.tag_name }}
        if: github.event_name == 'release'
        working-directory: agents
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          has() { gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -xF -- "$1" > /dev/null; }
          for f in $FILES; do
            if has "$f"; then
              echo "$f is already on the release; keeping it"
            elif gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"; then
              echo "uploaded $f"
            elif has "$f"; then
              echo "$f appeared on the release meanwhile; keeping it"
            else
              echo "::error::could not upload $f"
              exit 1
            fi
          done
          SUMS=crossshell-host-SHA256SUMS
          if has "$SUMS"; then
            echo "$SUMS is already on the release; keeping it"
          else
            mkdir on-release
            for f in $FILES; do
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$f" --dir on-release
            done
            (cd on-release && sha256sum $FILES) > "$SUMS"
            cat "$SUMS"
            gh release upload "$TAG" "$SUMS" --repo "$GITHUB_REPOSITORY" || has "$SUMS"
          fi
