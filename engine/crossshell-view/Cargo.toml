[package]
name = "crossshell-view"
description = "CrossShell remote-desktop viewer window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "crossshell-view"
path = "src/main.rs"

[dependencies]
crossshell-proto = { path = "../crossshell-proto" }
anyhow = "1"
serde_json = "1"
winit = "0.30"
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
fast_image_resize = { version = "6", features = ["rayon"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
png = "0.18"
bytemuck = "1"
