[package]
name = "crossshell-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Pure-Rust (miniz_oxide) zlib, so static musl builds need no C zlib.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
jpeg-encoder = "0.7.1"
rayon = "1.12.0"
thiserror = "2.0.21"
zstd = "0.14.2"
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[dev-dependencies]
anyhow = "1"
serde_json = "1"
