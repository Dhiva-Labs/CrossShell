[package]
name = "crossshell-platform-windows"
description = "Windows capture (DXGI Desktop Duplication) and input (SendInput) for the CrossShell host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crossshell-platform = { path = "../crossshell-platform" }
crossshell-proto = { path = "../crossshell-proto" }
anyhow = "1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Extra APIs the probe example uses for its test window.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Dwm",
    "Win32_Security",
] }
