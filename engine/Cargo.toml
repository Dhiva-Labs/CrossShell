[workspace]
resolver = "2"
members = ["crossshell-proto", "crossshell-host", "crossshell-view", "crossshell-platform", "platform-windows", "platform-linux"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Dhiva-Labs/CrossShell"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
