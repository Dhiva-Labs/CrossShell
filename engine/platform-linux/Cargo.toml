[package]
name = "crossshell-platform-linux"
description = "Linux capture and input for the CrossShell host: xdg-desktop-portal + PipeWire (Wayland), XShm + XTest (X11)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["pipewire"]
# The Mutter and xdg-desktop-portal backends, which receive frames as
# PipeWire streams. Without it only the X11 backend is built and the crate
# links no C library (x11rb and zbus are pure Rust), so it can be a static
# musl binary.
pipewire = ["dep:pipewire"]

[dependencies]
crossshell-platform = { path = "../crossshell-platform" }
crossshell-proto = { path = "../crossshell-proto" }
anyhow = "1"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
pipewire = { version = "0.10", optional = true }
x11rb = { version = "0.13", features = ["shm", "randr", "xfixes", "xtest", "damage"] }
libc = "0.2"
async-io = "2"
futures-lite = "2"

# Peer-to-peer D-Bus for the notification tests (no bus involved).
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io", "p2p"] }
