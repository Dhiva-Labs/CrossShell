# Package metadata for the other-distribution packages (.rpm, Arch package,
# AppImage, AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. The installed tree comes from the
# release tarball (packaging/linux-distros/tree.sh); CrossShell has no .deb.

NAME=crossshell
APP_NAME=CrossShell
GITHUB_REPO=Dhiva-Labs/CrossShell
TAG_PREFIX=v
SUMMARY='SSH both ways, files and remote desktop between Linux and Windows'
DESCRIPTION='CrossShell links a Linux machine and a Windows machine (or any mix of the two) on the same network: it sets up OpenSSH both ways with a 6-digit pairing code and pinned host keys, and adds terminal tabs, an SFTP file manager, port forwards and its own remote desktop, tunneled through SSH.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/CrossShell
LICENSE=MIT
LICENSE_FILE=LICENSE

# lib/libdartjni.so comes from the `jni` package the Android plugins pull in.
# CMake builds it only when it finds a JDK (the CI runners have one) and links
# it to that JDK's libjvm.so; the desktop app never loads it, and the snap,
# built without a JDK, has none. Shipping it would make rpm require
# libjvm.so and fail the ldd check, so every new format leaves it out.
EXCLUDE=(usr/lib/crossshell/lib/libdartjni.so)

# rpm: libraries (GTK 3, PipeWire for screen sharing) come from the ELF
# files, except EGL and GLES: Flutter's engine opens them at run time
# (libepoxy), so they are no NEEDED entries, and a minimal Fedora does not
# have libGLESv2; as rpm soname capabilities they resolve on Fedora and
# openSUSE alike. The app runs the OpenSSH client tools itself; pkexec is
# optional (setting up the SSH server and the firewall from the app).
RPM_REQUIRES=('libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)'
  /usr/bin/ssh /usr/bin/ssh-keygen /usr/bin/ssh-keyscan)
RPM_RECOMMENDS=(/usr/bin/pkexec)
ARCH_DEPENDS=(gtk3 gcc-libs libglvnd libpipewire openssh)
ARCH_OPTDEPENDS=('polkit: setting up the SSH server and the firewall from the app')
ARCH_INDEPENDENT=0

# AppImage: started at the Flutter runner, which finds lib/, data/ and the
# engine binaries next to itself.
APPIMAGE=1
EXEC=usr/lib/crossshell/cross_shell
DESKTOP=usr/share/applications/com.dhivalabs.cross_shell.desktop
ICON=usr/share/icons/hicolor/256x256/apps/com.dhivalabs.cross_shell.png
APPRUN_ENV=''

# Smoke test in each distribution container (verify.sh mounts the repository
# at /src): scripts/smoke-linux.sh, the one CI runs on the tarball, on the
# installed /usr/lib/crossshell (or the AppImage's copy of it). It streams the
# synthetic and the X11 screen through crossshell-host and crossshell-view
# and has the app render a picture of its window and start its agent.
APP_DIR=usr/lib/crossshell
SMOKE_SCRIPT=scripts/smoke-linux.sh
GUI_CMD=crossshell
SMOKE_SECONDS=20
SMOKE_CMD=''
